name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # 네트워크·npm 재실행 없이 1초 미만. SBOM은 재생성하지 않고 신원 필드만 대조한다
      # (timestamp·documentNamespace가 비결정적이라 재생성 후 diff는 상시 red가 된다).
      # SBOM을 커밋하지 않는 앱에서는 no-op이라 12개 앱에 그대로 붙일 수 있다.
      - name: Verify vendored artifacts
        run: |
          node scripts/verify-sbom-identity.mjs
          node scripts/verify-vendor-readme.mjs
